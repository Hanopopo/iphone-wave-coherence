name: Build unsigned IPA

on:
  push:
    branches: [main, "devin/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build WaveCoherence.ipa
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project WaveCoherence.xcodeproj

      - name: Build app (unsigned)
        run: |
          set -e
          xcodebuild \
            -project WaveCoherence.xcodeproj \
            -scheme WaveCoherence \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WaveCoherence-unsigned.ipa Payload
          ls -lh WaveCoherence-unsigned.ipa
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveCoherence-unsigned-ipa
          path: WaveCoherence-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
